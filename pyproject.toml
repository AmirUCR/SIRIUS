[build-system]
requires = ["setuptools>=69", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "sirius"
version = "1.0"
description = "SIRIUS: codon-diverse sequence generator with ILP/CP-SAT core"
authors = [{ name = "Amirsadra Mohseni", email = "amohs002@ucr.edu" }]
requires-python = ">=3.10"

[project.scripts]
sirius = "sirius.sirius_wrapper:main"

[tool.cibuildwheel.linux]
environment = { CFLAGS = "-m=64" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["sirius*"]

[tool.setuptools.package-data]
"sirius" = ["build/sirius", "resources/py27_env.tar.gz"]
"sirius.GeneDiversifier" = ["*.py", "data/*.csv"]
